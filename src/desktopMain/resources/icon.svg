<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="komaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6ba;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4b475;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" />
      <feOffset dx="0" dy="15" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="50" y="50" width="924" height="924" rx="200" ry="200" fill="url(#bgGradient)" stroke="#cccccc" stroke-width="2"/>

  <!-- Koma Shape -->
  <g filter="url(#shadow)">
    <path d="M512 180 L780 340 L730 820 L294 820 L244 340 Z" fill="url(#komaGradient)" stroke="#4a3b28" stroke-width="8"/>
    <text x="512" y="660" font-family="serif" font-size="340" text-anchor="middle" fill="#2c241a" font-weight="bold">蔵</text>
  </g>
</svg>
